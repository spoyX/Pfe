<div class="container py-4">
    <div class="row g-4">
      <!-- Left Column (User Info + Instructions) -->
      <div class="col-lg-3">
        <div class="card user-side-card shadow-sm border-0 h-100">
          <div class="card-body text-center d-flex flex-column justify-content-between">
            <div>
              <h5 class="fw-bold mb-3 text-primary">Your Calendar</h5>
              <p class="small text-muted mb-4">
                View all your appointments and sessions here.
              </p>
            </div>
            <img 
              src="assets/verification-img.png" 
              alt="Calendar Illustration" 
              class="img-fluid rounded-3 mb-3"
              style="height: 500px;"
            >
          </div>
        </div>
      </div>
  
      <!-- Right Column (Calendar) -->
      <div class="col-lg-9">
        <div class="card calendar-card shadow-sm border-0 h-100">
          <div class="card-header bg-light py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-primary">My Events</h5>
          </div>
          <div class="card-body p-0">
            <ejs-schedule
              #schedule
              [currentView]="currentView"
              [eventSettings]="eventSettings"
              [height]="'600px'"
              [width]="'100%'"
              [readonly]="true"
              [cssClass]="'e-custom-schedule'"
            ></ejs-schedule>
          </div>
        </div>
      </div>
    </div>
  </div>
