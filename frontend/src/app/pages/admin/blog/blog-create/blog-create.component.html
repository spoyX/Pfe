<!-- blog-create.component.html -->
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-white">
      <h2 class="mb-0 py-2">Create New Blog</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="blogForm" (ngSubmit)="onSubmit()">
        <!-- Title -->
        <div class="form-group mb-4">
          <label for="title" class="form-label fw-medium">Title</label>
          <input
            id="title"
            type="text"
            formControlName="title"
            class="form-control form-control-lg"
            placeholder="Enter blog title"
            [class.is-invalid]="blogForm.get('title')?.touched && blogForm.get('title')?.invalid"
          />
          <div class="invalid-feedback" *ngIf="blogForm.get('title')?.hasError('required')">
            Title is required.
          </div>
          <div class="invalid-feedback" *ngIf="blogForm.get('title')?.hasError('minlength')">
            Title must be at least 3 characters.
          </div>
        </div>

        <!-- Tags -->
        <div class="form-group mb-4">
          <label for="tags" class="form-label fw-medium">Categorie </label>
          <input
            id="tags"
            type="text"
            formControlName="tags"
            class="form-control"
            placeholder="technology, coding, angular"
          />
          <small class="text-muted">Separate tags with commas to categorize your blog</small>
        </div>

        <!-- Rich Text Editor -->
        <div class="form-group mb-4">
          <label for="content" class="form-label fw-medium">Content</label>
          <ejs-richtexteditor
            id="content"
            formControlName="content"
            [toolbarSettings]="toolbarSettings"
            [placeholder]="'Start writing your blog post here...'"
            [height]="450"
          >
          </ejs-richtexteditor>
          <div class="text-danger mt-2" *ngIf="blogForm.get('content')?.touched && blogForm.get('content')?.hasError('required')">
            Content is required.
          </div>
        </div>

        <!-- Featured Image Upload -->
        <div class="form-group mb-4">
          <label for="image" class="form-label fw-medium">Featured Image</label>
          <div class="input-group">
            <input
              id="image"
              type="file"
              class="form-control"
              (change)="onImageUpload($event)"
              accept="image/*"
            />
            <label class="input-group-text" for="image">
              <i class="bi bi-upload me-1"></i> Browse
            </label>
          </div>
          <small class="text-muted">Recommended size: 1200 x 630 pixels</small>
          
          <!-- Image Preview -->
          <div *ngIf="imagePreview" class="mt-3">
            <img [src]="imagePreview" class="img-fluid img-thumbnail" style="max-height: 200px;" alt="Preview" />
            <button type="button" class="btn btn-sm btn-outline-danger mt-2" (click)="removeImage()">
              <i class="bi bi-trash me-1"></i> Remove
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-primary px-4 py-2"
          [disabled]="blogForm.invalid || isSubmitting"
        >
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          Publish Blog
        </button>
      </form>
    </div>
  </div>
</div>
