<aside id="sidebar" class="sidebar">
  <div class="position-sticky">
      <div class="sidebar-header d-flex flex-column align-items-start px-3 pt-2 pb-1">
          <div class="logo">
              <span class="membra-logo" style="font-weight: bold; color: #555;">Membra</span>
          </div>
         <div class="user-info mt-3 position-relative">
        <a class="iconLink position-relative" (click)="toggleDropdown()">
          <i class="bi bi-bell"></i>
          <span *ngIf="unreadCount > 0" class="badge bg-danger position-absolute top-0 start-100 translate-middle">
            {{ unreadCount }}
          </span>
        </a>

        <a href="/admin/settings" class="iconLink"><i class="bi bi-gear"></i></a>
      </div>
    </div>

    <!-- Notifications Dropdown -->
    <div *ngIf="showDropdown" class="notifications-dropdown shadow mt-2 rounded bg-white position-absolute z-3">
  <div *ngIf="notifications.length === 0" class="text-muted text-center">No notifications</div>
  <div *ngFor="let notif of notifications" class="notification-item">
    <small [class.text-muted]="notif.read" (click)="markAsRead(notif._id)">
      {{ notif.message }}
      <div class="text-muted mt-1 small">{{ notif.createdAt | timeAgo }}</div>
    </small>
    <button class="btn btn-sm text-danger notification-delete" (click)="deleteNotification(notif._id, $event)">
      <i class="bi bi-x-circle"></i>
    </button>
  </div>
</div>

      <div class="search-bar px-3 mt-3">
          <input type="text" class="form-control" placeholder="Search for...">
      </div>
      <ul class="nav flex-column mt-3">
        <li class="nav-item">
            <a class="nav-link" 
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }" 
               routerLink="/admin/">
                <i class="bi bi-speedometer2 nav-icon me-2"></i>
                <span>Dashboard</span>
            </a>
        </li>
        
        <!-- Blog Dashboard as a visually nested submenu item -->
        <li class="nav-item">
            <a class="nav-link ps-4" 
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" 
            routerLink="/admin/Blog-Dashboard">
                <i class="bi bi-file-earmark-richtext nav-icon me-2"></i>
                <span>Blog Dashboard</span>
            </a>
        </li>
        
        <li class="nav-item">
            <a class="nav-link" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" routerLink="/admin/user-management" ><i class="fa fa-users"></i> Users <span class="badge bg-secondary">99+</span></a>
        </li>
          <li class="nav-item">
              <a class="nav-link" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" routerLink="/admin/event-list">
                  <i class="bi bi-calendar nav-icon me-2"></i>
                  <span>Événements</span>
              </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" routerLink="/admin/calendar">
              <i class="bi bi-calendar-event nav-icon me-2"></i>
              <span>Calendrier</span>
            </a>
          </li>
          
          <li class="nav-item">
            <a class="nav-link" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" routerLink="/admin/blog">
                <i class="bi bi-journal-text nav-icon me-2"></i>
                <span>Blog</span>
            </a>
        </li>
        
        <li class="nav-item">
            <a class="nav-link" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" routerLink="/admin/chat">
                <i class="bi bi-chat-dots nav-icon me-2"></i>
                <span>Chat</span>
            </a>
        </li>

      
      </ul>
  </div>
</aside>
